# phosphor-rain configuration

# Space-separated xrandr output names that must NEVER show the wallpaper.
# Use this for a display that drives something other than a desktop: a capture
# card, a projector, or an instrument such as a spatial light modulator.
#   EXCLUDE="HDMI-1 DP-3"
EXCLUDE=""

# Renderer options. Only --fps and the total window area affect CPU cost;
# density, trail length and speed are effectively free. See the README.
RAIN_OPTS="--fps 3 --size 18 --density 0.60 --trail-min 4 --trail-max 56 --speed-min 0.625 --speed-max 2.0 --mutate 0.8 --bg-alpha 0.0"
