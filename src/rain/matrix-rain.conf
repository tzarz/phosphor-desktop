# Monitors that must NEVER show the rain.
# HDMI-0 drives a spatial light modulator - keep it clean.
EXCLUDE="HDMI-0"

# Renderer tuning. Lower FPS and density = less CPU.
RAIN_OPTS="--fps 3 --size 18 --density 0.60 --trail-min 4 --trail-max 56 --speed-min 0.625 --speed-max 2.0 --mutate 0.8 --bg-alpha 0.0"
